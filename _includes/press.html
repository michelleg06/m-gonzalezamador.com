<h2 class="mt-4">Press & Media</h2>

{% for item in site.data.press %}
<div class='mt-3'>
    {{ item.title }}
    {% if item.link %}
    <a class="badge badge-primary" href="{{ item.link }}">link</a>
    {% endif %}
    <br>
    <small class="text-secondary">
        <strong>{{ item.outlet }}</strong>
        {% if item.description %} — {{ item.description }}{% endif %}
    </small>
</div>
{% endfor %}
